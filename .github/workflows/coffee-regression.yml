name: Work OS local and PostgreSQL regression checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workos_test
          POSTGRES_PASSWORD: temporary-ci-only-password
          POSTGRES_DB: workos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos_test -d workos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend compilation and isolated SQLite tests
        run: |
          python -m compileall -q backend/app
          python -m unittest discover -s backend/tests -v
      - name: Install isolated PostgreSQL test dependency
        run: python -m pip install -r backend/requirements.txt
      - name: Run disposable PostgreSQL financial posting and migration checks
        env:
          WORKOS_TEST_POSTGRES_URL: postgresql://workos_test:temporary-ci-only-password@127.0.0.1:5432/workos_ci
        run: python -m unittest discover -s backend/tests -p 'test_postgres_live.py' -v
      - name: Rehearse exact schema 43 → 44 → 45 SQL against disposable local PostgreSQL
        env:
          WORKOS_TEST_POSTGRES_URL: postgresql://workos_test:temporary-ci-only-password@127.0.0.1:5432/workos_ci
        run: python backend/check_migrations_ci.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Frontend install and production build
        run: |
          npm ci
          npm run build
