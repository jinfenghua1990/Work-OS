name: Coffee import regression checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend compilation and isolated SQLite tests
        run: |
          python -m compileall -q backend/app
          python -m unittest discover -s backend/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Frontend install and production build
        run: |
          npm ci
          npm run build
