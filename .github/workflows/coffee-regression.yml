name: Work OS local and PostgreSQL regression checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workos_test
          POSTGRES_PASSWORD: temporary-ci-only-password
          POSTGRES_DB: workos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos_test -d workos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend compilation and isolated SQLite tests
        run: |
          python -m compileall -q backend/app
          python -m unittest discover -s backend/tests -v
      - name: Install isolated PostgreSQL test dependency
        run: python -m pip install -r backend/requirements.txt
      - name: Run disposable PostgreSQL financial posting and migration checks
        env:
          WORKOS_TEST_POSTGRES_URL: postgresql://workos_test:temporary-ci-only-password@127.0.0.1:5432/workos_ci
        run: python -m unittest discover -s backend/tests -p 'test_postgres_live.py' -v
      - name: Rehearse exact schema 43 → 44 → 45 → 46 SQL against disposable local PostgreSQL
        env:
          WORKOS_TEST_POSTGRES_URL: postgresql://workos_test:temporary-ci-only-password@127.0.0.1:5432/workos_ci
        run: python backend/check_migrations_ci.py
      - name: Restore disposable PostgreSQL dump into an empty CI database
        env:
          WORKOS_TEST_POSTGRES_URL: postgresql://workos_test:temporary-ci-only-password@127.0.0.1:5432/workos_ci
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter ancestor=postgres:18-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$container_id" || { echo "PostgreSQL 18 CI container unavailable"; exit 1; }
          docker exec "$container_id" pg_dump -U workos_test -d workos_ci -Fc -f /tmp/workos_restore_ci.dump
          docker exec "$container_id" pg_restore --list /tmp/workos_restore_ci.dump > /dev/null
          docker exec "$container_id" createdb -U workos_test -T template0 workos_restore_ci
          docker exec "$container_id" pg_restore -U workos_test -d workos_restore_ci --no-owner --no-acl /tmp/workos_restore_ci.dump
          python backend/check_pg_restore_ci.py
          docker exec "$container_id" dropdb -U workos_test workos_restore_ci
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Frontend install and production build
        run: |
          npm ci
          npm run build
